# Serves OmanAI's page: static files, compressed, with headers that keep the page to itself.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Scripts come from the site itself and from 9h Digital's chat assistant, which the page also talks to.
    # The only other outside request asks GitHub for the latest version.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://ai-chatbot-staging.9hdigital.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src https://api.github.com https://ai-chatbot-staging.9hdigital.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Recordings and pictures change name when they change, so they can be kept for a week.
    location /media/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.(css|js|svg|png)$ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://ai-chatbot-staging.9hdigital.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src https://api.github.com https://ai-chatbot-staging.9hdigital.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri $uri/ =404;
    }
}
