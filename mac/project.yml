name: Oman
options:
  bundleIdPrefix: com.romanbitca
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  OmanKit:
    path: OmanKit
  # Sparkle 2.10.1, pinned to its commit so the tag can't be moved to different code.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    revision: ab7d71291238df6e0492143b120c9b696a35f603
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Oman:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - AppIcon.icon
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: OmanKit
        product: OmanCore
      - package: OmanKit
        product: ClaudeAPI
      - package: OmanKit
        product: OmanStorage
      - package: OmanKit
        product: SystemBridge
      - package: OmanKit
        product: OmanUI
      - package: OmanKit
        product: OmanSpeech
      - package: Sparkle
        product: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: OmanAI
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        SUFeedURL: https://github.com/romanbitca/oman-ai/releases/latest/download/appcast.xml
        SUPublicEDKey: "$(SPARKLE_PUBLIC_KEY)"
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        # An update must carry the EdDSA signature before it is even unpacked, and the feed and its
        # release notes must be signed too.
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
        NSMicrophoneUsageDescription: OmanAI listens while you dictate and turns what you say into text, on this Mac.
    entitlements:
      path: App/Oman.entitlements
      properties:
        com.apple.security.app-sandbox: false
        # Release builds use the hardened runtime, which keeps the microphone closed without this.
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_NAME: OmanAI
        PRODUCT_BUNDLE_IDENTIFIER: com.romanbitca.oman
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Left empty so local builds don't update themselves. scripts/release.sh fills it in.
        SPARKLE_PUBLIC_KEY: ""
        # Ad hoc, so anyone can build without an Apple account. scripts/release.sh signs with Developer ID.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
